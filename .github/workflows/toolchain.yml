name: Projekt importieren und prüfen
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Lokale Projekt-Commits übernehmen
        env:
          PROJECT_BUNDLE: ''
        run: |
          printf '%s' "$PROJECT_BUNDLE" | base64 --decode > "$RUNNER_TEMP/project.bundle"
          git bundle verify "$RUNNER_TEMP/project.bundle"
          git fetch "$RUNNER_TEMP/project.bundle" refs/heads/main:refs/heads/submission
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --allow-unrelated-histories --no-edit submission
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: npm-Abhängigkeiten installieren
        run: npm install --no-audit --no-fund
      - name: Sass-Build prüfen
        run: |
          npm run scss:build
          test -s dist/css/style.css
          test -s dist/css/fonts/bootstrap-icons.woff2
      - name: Grid, Icons und Live-Reload in Chrome prüfen
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-check" --no-save --no-audit --no-fund playwright@1.58.2
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-check/node_modules/playwright"
          npm run scss:watch > "$RUNNER_TEMP/sass.log" 2>&1 &
          sass_pid=$!
          npm run serve > "$RUNNER_TEMP/browser-sync.log" 2>&1 &
          server_pid=$!
          trap 'cat "$RUNNER_TEMP/sass.log" "$RUNNER_TEMP/browser-sync.log"; kill "$sass_pid" "$server_pid" 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --silent --fail http://127.0.0.1:3000/ -o /dev/null
          timeout 15 bash -c 'until grep -q "Sass is watching for changes" "$RUNNER_TEMP/sass.log"; do sleep 0.2; done'
          node <<'JS'
          const assert = require('node:assert/strict');
          const {readFile, writeFile} = require('node:fs/promises');
          const {chromium} = require(process.env.PLAYWRIGHT_MODULE);

          async function verify() {
            const htmlPath = 'index.html';
            const sassPath = 'src/scss/style.scss';
            const html = await readFile(htmlPath, 'utf8');
            const sass = await readFile(sassPath, 'utf8');
            const browser = await chromium.launch({channel: 'chrome'});
            try {
              const page = await browser.newPage({viewport: {width: 1200, height: 900}});
              page.setDefaultTimeout(15000);
              const connection = page.waitForEvent('websocket', {
                predicate: socket => socket.url().includes('/browser-sync/'),
              });
              const response = await page.goto('http://127.0.0.1:3000/');
              assert.equal(response.status(), 200);
              await connection;
              assert(await page.evaluate(async () => {
                await document.fonts.ready;
                return [...document.fonts].some(font => font.family === 'bootstrap-icons' && font.status === 'loaded');
              }), 'Bootstrap Icons font did not load');

              const columns = page.locator('.hero .col-md-6');
              const positions = () => Promise.all([columns.nth(0).boundingBox(), columns.nth(1).boundingBox()]);
              const [left, right] = await positions();
              assert(right.x > left.x, 'Desktop columns must sit side by side');
              await page.setViewportSize({width: 320, height: 780});
              const [top, bottom] = await positions();
              assert(Math.abs(top.x - bottom.x) < 1 && bottom.y > top.y, 'Mobile columns must stack');
              assert(await page.evaluate(() => document.documentElement.scrollWidth === innerWidth), 'Mobile page overflows');
              await page.getByRole('link', {name: 'Werkzeuge'}).click();
              assert.equal(new URL(page.url()).hash, '#werkzeuge');
              console.log('Responsive layout, link and icon font verified.');

              await writeFile(sassPath, sass + '\n.hero h1 span { color: rgb(1, 27, 43); }\n');
              await page.waitForFunction(() => getComputedStyle(document.querySelector('.hero h1 span')).color === 'rgb(1, 27, 43)');
              console.log('Sass watch and CSS injection verified.');

              await writeFile(htmlPath, html.replace('</body>', '<p>Live-Reload-Test</p>\n</body>'));
              await page.getByText('Live-Reload-Test', {exact: true}).waitFor();
              console.log('HTML reload verified.');
            } finally {
              await browser.close();
              await Promise.all([writeFile(htmlPath, html), writeFile(sassPath, sass)]);
            }
          }
          verify().catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - name: Lockdatei und geprüften Projektstand pushen
        run: |
          git diff --exit-code
          git add -- package-lock.json
          git commit -m 'Lock npm dependencies'
          git push origin HEAD:refs/heads/main
          git bundle create "$RUNNER_TEMP/published-project.bundle" refs/heads/main
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/published-project.bundle
          archive: false
          retention-days: 1
